repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: ['-l', '88']
        files: '^(src/core/(yaml_utils|proc|dynamic_eval)\.py|src/sandbox/.*|tests/core/test_yaml_utils\.py|tests/sandbox/test_exec_sandbox\.py)'

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: ['--fix']
        files: '^(src/core/(yaml_utils|proc|dynamic_eval)\.py|src/sandbox/.*|tests/core/test_yaml_utils\.py|tests/sandbox/test_exec_sandbox\.py)'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: ['types-PyYAML']
        files: '^(src/core/(yaml_utils|proc|dynamic_eval)\.py|src/sandbox/.*)'

  # TypeScript/JavaScript quality
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^extensions/.*\.(ts|js|json|md)$
        exclude: ^(node_modules/|\.next/|dist/|out/)

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: mixed-line-ending

  # Extension compilation check
  - repo: local
    hooks:
      - id: extension-compile-check
        name: Extension TypeScript Compilation
        entry: bash -c 'cd extensions/alita-language-tools && npm ci > /dev/null 2>&1 && npm run compile > /dev/null'
        language: system
        files: ^extensions/alita-language-tools/src/.*\.(ts|js)$
        pass_filenames: false

      - id: no-debug-statements
        name: No Debug Statements
        entry: 'grep -E "(console\.log|debugger|pdb\.set_trace|breakpoint\(\))"'
        language: system
        files: \.(py|ts|js)$
        exclude: ^(tests/|examples/|debug_)

default_stages: [commit, push]
