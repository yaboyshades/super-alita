# Codex runtime configuration for Super Alita
# Generated to unify local MCP + Agent runtime expectations.
# Adjust endpoints or feature flags as needed.

[runtime]
name = "super-alita"
pythonpath = "./src"
entrypoint = "mcp_server_entrypoint.py"
setup_script = "./.codex/setup.sh"

[server]
# Host/port pair used when running an HTTP bridge (if applicable)
host = "127.0.0.1"
port = 8765
# Enable stdio MCP (primary integration path)
use_stdio = true

[logging]
level = "INFO"
# Alternate values: DEBUG, WARNING, ERROR

[features]
# Toggle experimental capabilities exposed to Codex
knowledge_graph = true
ladder_planner = true
consensus = true
mangle = true
shadow_reward = true
snippet_optimizer = true

[paths]
# Directory where temporary artifacts for Codex tasks may be stored
temp_dir = "./.codex/tmp"
# Location for generated reports
reports_dir = "./.codex/reports"

[security]
# If true, restricts tool execution to a vetted allowlist
sandbox = false

[tools]
# Example: enable or disable certain tool groups dynamically
enable_dynamic_tools = true

[env]
# Keys will be appended / ensured in .env by setup script if present
# OPENAI_API_KEY = ""
# ANTHROPIC_API_KEY = ""
# GEMINI_API_KEY = ""

# End of config.toml
