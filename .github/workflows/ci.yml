name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -U pip pytest coverage black ruff bandit pyyaml pydocstyle
      - run: ruff check .
      - run: pydocstyle src
      - run: black --check .
      - run: |
          coverage run -m pytest -q
          coverage report --fail-under=80
      - run: |
          for f in features/**/spec.md; do
            [ -f "$f" ] || continue
            python tools/pel_update_yaml.py "$f" || true
          done
