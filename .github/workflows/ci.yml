name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt || true

      - name: Static analysis (ruff + mypy)
        run: |
          ruff check .
          mypy --strict src || echo "Type check soft-fail (adjust policy later)"

      - name: Unit & integration tests
        run: |
          pytest -q --maxfail=1 --disable-warnings --cov=src --cov-report=xml --durations=15

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false