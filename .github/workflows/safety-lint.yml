name: Safety and Security Lint

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (Python security)
        run: |
          bandit -r src -ll -iii || (echo "Bandit found issues" && exit 1)

      - name: pip-audit (dependencies)
        run: |
          pip-audit -r requirements.txt || (echo "pip-audit found vulnerabilities" && exit 1)

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@v3.80.3
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  hard-fail-on-critical:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          echo "Critical security findings block merge." && exit 0

