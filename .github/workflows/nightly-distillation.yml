name: Nightly Memory Distillation
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
jobs:
  distill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Fetch episodic traces
        env:
          EPISODIC_API_TOKEN: ${{ secrets.EPISODIC_API_TOKEN }}
        run: python scripts/fetch_episodes.py --out data/episodes_raw --limit 10000

      - name: Distill
        run: |
          python distillation/summarize_memories.py \
            --input data/episodes_raw \
            --output memory/distilled \
            --max-chunk-tokens 2000

      - name: Commit distilled artifacts
        run: |
          if [ -n "$(git status --porcelain memory/distilled)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git checkout -b distill-$(date -u +%Y%m%d)
            git add memory/distilled
            git commit -m "Nightly distillation $(date -u +%F)"
            git push origin HEAD
            gh pr create --title "Nightly distillation $(date -u +%F)" --body "Automated memory distillation." || true
          else
            echo "No distillation changes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}