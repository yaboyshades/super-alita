name: Socratic Spec Validation

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  ste-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STE_THRESHOLD: "0.85"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Socratic Testing Engine across docs/*.md
        run: |
          python - << 'PY'
          import json, subprocess, os, sys, glob

          threshold = float(os.getenv('STE_THRESHOLD', '0.85'))
          md_files = sorted(glob.glob('docs/*.md'))
          if not md_files:
            print('No docs/*.md files found; skipping STE validation.')
            sys.exit(0)

          failures = []
          summary = []
          for path in md_files:
            try:
              result = subprocess.run(
                [sys.executable, 'tools/socratic_testing_engine.py', '--spec', path, '--format', 'json'],
                capture_output=True,
                text=True,
                check=True,
              )
              report = json.loads(result.stdout)
              meta = report.get('analysis_metadata', {})
              readiness = float(meta.get('spec_readiness_score', 0.0))
              findings = report.get('findings', [])
              high = [f for f in findings if str(f.get('severity','')).lower() == 'high']
              ok = readiness >= threshold and len(high) == 0
              summary.append((path, readiness, len(high), ok))
              if not ok:
                failures.append((path, readiness, [f.get('issue','') for f in high]))
            except subprocess.CalledProcessError as e:
              print(f'[STE] Engine failed on {path}:', e.stderr or e.stdout)
              failures.append((path, -1.0, ['engine error']))
            except Exception as e:  # parse/runtime errors
              print(f'[STE] Error on {path}: {e}')
              failures.append((path, -1.0, ['exception']))

          print('\nSocratic Testing Summary:')
          for path, readiness, high_cnt, ok in summary:
            status = 'OK' if ok else 'FAIL'
            print(f'- {path}: readiness={readiness:.2f}, high={high_cnt} -> {status}')

          if failures:
            print('\nFailures: (threshold=', threshold, ')')
            for path, readiness, issues in failures:
              print(f'  * {path}: readiness={readiness:.2f}; high issues={len(issues)}')
              for i in issues[:5]:
                print('     -', i)
            sys.exit(1)

          PY

