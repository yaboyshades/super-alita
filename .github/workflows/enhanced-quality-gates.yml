name: Enhanced Quality Gates

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-quality:
    name: TypeScript Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/alita-language-tools/package-lock.json

      - name: Install dependencies
        working-directory: extensions/alita-language-tools
        run: npm ci

      - name: Type checking
        working-directory: extensions/alita-language-tools
        run: npx tsc --noEmit --strict

      - name: ESLint strict
        working-directory: extensions/alita-language-tools
        run: npm run lint -- --max-warnings 0

      - name: Prettier format check
        working-directory: extensions/alita-language-tools
        run: npx prettier --check "src/**/*.{ts,js,json}"

      - name: Dead code detection
        working-directory: extensions/alita-language-tools
        run: |
          npx unimported --flow=false --init=true

      - name: Bundle size check
        working-directory: extensions/alita-language-tools
        run: |
          npm run compile
          BUNDLE_SIZE=$(du -sh out/ | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          # Fail if bundle > 5MB
          SIZE_BYTES=$(du -s out/ | cut -f1)
          if [ $SIZE_BYTES -gt 5120 ]; then
            echo "❌ Bundle too large: $BUNDLE_SIZE (limit: 5MB)"
            exit 1
          fi

  wasm-component-tests:
    name: WASM Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasi

      - name: Install WASM tools
        run: |
          cargo install wasm-tools
          cargo install wit-bindgen-cli

      - name: Build WASM components
        run: |
          cd wasm/calculator && cargo build --target wasm32-wasi --release
          cd ../code_radar && cargo build --target wasm32-wasi --release

      - name: Componentize WASM
        run: |
          wasm-tools component new wasm/calculator/target/wasm32-wasi/release/calculator.wasm -o calculator.wasm
          wasm-tools component new wasm/code_radar/target/wasm32-wasi/release/code_radar.wasm -o code_radar.wasm

      - name: Validate WIT interfaces
        run: |
          wasm-tools component wit wasm/calculator/calculator.wit
          wasm-tools component wit wasm/code_radar/radar.wit

      - name: Test component integration
        working-directory: extensions/alita-language-tools
        run: |
          npm ci
          npm run test:component

  integration-tests:
    name: End-to-End Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/alita-language-tools/package-lock.json

      - name: Install extension dependencies
        working-directory: extensions/alita-language-tools
        run: npm ci

      - name: Run integration tests
        env:
          REUG_EVENTBUS: redis
          PYTHONPATH: ./src
        run: |
          pytest tests/integration -v --tb=short

      - name: Test MCP connectivity
        env:
          PYTHONPATH: ./src
        run: |
          python test_mcp_simple.py

      - name: Test agent systems
        env:
          PYTHONPATH: ./src
        run: |
          python test_complete_agent_system.py

      - name: Extension integration test
        working-directory: extensions/alita-language-tools
        run: |
          npm run compile
          npm run test:integration

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety bandit semgrep
          pip install -r requirements.txt

      - name: Python security audit (pip-audit)
        run: pip-audit -r requirements.txt --format=json --output=pip-audit.json
        continue-on-error: true

      - name: Python security scan (bandit)
        run: bandit -r src/ -f json -o bandit.json
        continue-on-error: true

      - name: Static analysis (semgrep)
        run: semgrep --config=auto src/ --json --output=semgrep.json
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node.js security audit
        working-directory: extensions/alita-language-tools
        run: |
          npm ci
          npm audit --audit-level=moderate --json > npm-audit.json || echo "Audit completed with warnings"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            pip-audit.json
            bandit.json
            semgrep.json
            extensions/alita-language-tools/npm-audit.json

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-benchmark

      - name: Run Python benchmarks
        env:
          PYTHONPATH: ./src
        run: |
          pytest tests/benchmarks/ -v --benchmark-json=python-benchmarks.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extension benchmarks
        working-directory: extensions/alita-language-tools
        run: |
          npm ci
          npm run benchmark || echo "Benchmarks completed"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: |
            python-benchmarks.json
            extensions/alita-language-tools/benchmark-results.json

  quality-gate:
    name: Quality Gate
    needs: [typescript-quality, wasm-component-tests, integration-tests, security-audit, performance-benchmarks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "TypeScript Quality: ${{ needs.typescript-quality.result }}"
          echo "WASM Component Tests: ${{ needs.wasm-component-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Performance Benchmarks: ${{ needs.performance-benchmarks.result }}"

          # Fail if any critical job failed
          if [[ "${{ needs.typescript-quality.result }}" == "failure" ||
                "${{ needs.wasm-component-tests.result }}" == "failure" ||
                "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Critical quality checks failed!"
            exit 1
          fi

          # Warn on security/performance issues but don't block
          if [[ "${{ needs.security-audit.result }}" == "failure" ||
                "${{ needs.performance-benchmarks.result }}" == "failure" ]]; then
            echo "⚠️ Security or performance issues detected - review reports"
          fi

          echo "✅ Quality gate passed!"
