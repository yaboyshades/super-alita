name: Cost & Usage Report
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
jobs:
  cost-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt || true

      - name: Generate report
        env:
          BILLING_API_TOKEN: ${{ secrets.BILLING_API_TOKEN }}
        run: python reports/cost_report.py --out reports/cost.md --window-days 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: reports/cost.md

      - name: Commit (optional)
        run: |
          if [ -n "$(git status --porcelain reports/cost.md)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add reports/cost.md
            git commit -m "Daily cost report"
            git push
          fi