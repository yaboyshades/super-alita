name: SDD Constitutional Validation
on:
  pull_request:
    paths:
      - 'sdd/specs/**'
      - 'sdd/plans/**'
      - 'sdd/tasks/**'
      - 'src/sdd/**'
      - 'validate_sdd_epic.py'
  push:
    branches:
      - main
    paths:
      - 'sdd/specs/**'
      - 'sdd/plans/**'
      - 'sdd/tasks/**'
jobs:
  sdd-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: Validate deployment (project-level checks)
        run: python validate_deployment.py
      - name: Validate SDD Epic against Constitution (≥ 0.75)
        run: python validate_sdd_epic.py
      - name: Upload SDD artifacts
        uses: actions/upload-artifact@v4
        if: always()  # Upload artifacts even if validation fails
        with:
          name: sdd-advanced-debugging-and-perf
          path: sdd/artifacts/advanced_debugging_and_perf/