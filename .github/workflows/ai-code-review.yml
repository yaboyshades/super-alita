name: AI-Powered Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  analyze-changes:
    name: Analyze Code Changes
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.changed_files.outputs.files }}
      has_python_changes: ${{ steps.changed_files.outputs.has_python }}
      has_typescript_changes: ${{ steps.changed_files.outputs.has_typescript }}
      has_wasm_changes: ${{ steps.changed_files.outputs.has_wasm }}
      complexity_score: ${{ steps.complexity.outputs.score }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Get changed files
        id: changed_files
        run: |
          # Get the base commit for comparison
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # For manual dispatch, get PR info
            PR_BASE=$(gh pr view ${{ github.event.inputs.pr_number }} --json baseRefOid --jq '.baseRefOid')
            CHANGED_FILES=$(git diff --name-only $PR_BASE..HEAD)
          else
            # For PR events
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Store files in output
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check file types
          HAS_PYTHON=$(echo "$CHANGED_FILES" | grep -E "\.(py)$" | wc -l)
          HAS_TYPESCRIPT=$(echo "$CHANGED_FILES" | grep -E "\.(ts|js|tsx|jsx)$" | wc -l)
          HAS_WASM=$(echo "$CHANGED_FILES" | grep -E "\.(rs|wit)$" | wc -l)

          echo "has_python=$([[ $HAS_PYTHON -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_typescript=$([[ $HAS_TYPESCRIPT -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_wasm=$([[ $HAS_WASM -gt 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate change complexity
        id: complexity
        run: |
          CHANGED_FILES="${{ steps.changed_files.outputs.files }}"

          # Simple complexity scoring based on:
          # - Number of files changed
          # - Lines added/removed
          # - File types affected

          FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_BASE=$(gh pr view ${{ github.event.inputs.pr_number }} --json baseRefOid --jq '.baseRefOid')
            DIFF_STATS=$(git diff --numstat $PR_BASE..HEAD)
          else
            DIFF_STATS=$(git diff --numstat ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          fi

          TOTAL_ADDITIONS=$(echo "$DIFF_STATS" | awk '{sum += $1} END {print sum+0}')
          TOTAL_DELETIONS=$(echo "$DIFF_STATS" | awk '{sum += $2} END {print sum+0}')

          # Calculate complexity score (0-100)
          COMPLEXITY=0

          # File count factor (max 30 points)
          if [[ $FILE_COUNT -le 3 ]]; then
            COMPLEXITY=$((COMPLEXITY + 5))
          elif [[ $FILE_COUNT -le 10 ]]; then
            COMPLEXITY=$((COMPLEXITY + 15))
          else
            COMPLEXITY=$((COMPLEXITY + 30))
          fi

          # Lines changed factor (max 40 points)
          TOTAL_CHANGES=$((TOTAL_ADDITIONS + TOTAL_DELETIONS))
          if [[ $TOTAL_CHANGES -le 50 ]]; then
            COMPLEXITY=$((COMPLEXITY + 10))
          elif [[ $TOTAL_CHANGES -le 200 ]]; then
            COMPLEXITY=$((COMPLEXITY + 20))
          elif [[ $TOTAL_CHANGES -le 500 ]]; then
            COMPLEXITY=$((COMPLEXITY + 30))
          else
            COMPLEXITY=$((COMPLEXITY + 40))
          fi

          # File type factor (max 30 points)
          if [[ "${{ steps.changed_files.outputs.has_wasm }}" == "true" ]]; then
            COMPLEXITY=$((COMPLEXITY + 15))
          fi
          if [[ "${{ steps.changed_files.outputs.has_typescript }}" == "true" ]]; then
            COMPLEXITY=$((COMPLEXITY + 10))
          fi
          if [[ "${{ steps.changed_files.outputs.has_python }}" == "true" ]]; then
            COMPLEXITY=$((COMPLEXITY + 5))
          fi

          echo "score=$COMPLEXITY" >> $GITHUB_OUTPUT
          echo "Complexity score: $COMPLEXITY/100"
          echo "Files: $FILE_COUNT, Additions: $TOTAL_ADDITIONS, Deletions: $TOTAL_DELETIONS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deepcode-analysis:
    name: DeepCode AI Analysis
    needs: analyze-changes
    if: needs.analyze-changes.outputs.has_python_changes == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run DeepCode analysis on changed files
        env:
          REUG_EVENTBUS: redis
          PYTHONPATH: ./src
        run: |
          cat > deepcode_pr_analysis.py << 'EOF'
          import json
          import asyncio
          import sys
          from pathlib import Path
          from src.deepcode.analyzer_simple import create_deepcode_engine, AnalysisLevel

          async def analyze_changed_files():
              """Analyze changed Python files with DeepCode"""
              changed_files = """${{ needs.analyze-changes.outputs.files }}""".strip().split('\n')
              python_files = [f for f in changed_files if f.endswith('.py') and Path(f).exists()]

              if not python_files:
                  print("No Python files to analyze")
                  return

              print(f"Analyzing {len(python_files)} Python files with DeepCode...")

              engine = create_deepcode_engine(AnalysisLevel.DETAILED)
              all_results = {}

              for file_path in python_files:
                  try:
                      print(f"Analyzing: {file_path}")

                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      results = await engine.analyze_code(content, file_path)
                      all_results[file_path] = results

                      # Print summary for this file
                      if results.get('issues'):
                          issue_count = len(results['issues'])
                          quality_score = results.get('quality_score', 'N/A')
                          print(f"  🔍 {issue_count} issues found (Quality: {quality_score})")
                      else:
                          print(f"  ✅ No issues found")

                  except Exception as e:
                      print(f"  ❌ Analysis failed: {e}")
                      all_results[file_path] = {"error": str(e)}

              # Save results
              with open('deepcode-analysis.json', 'w') as f:
                  json.dump(all_results, f, indent=2)

              return all_results

          if __name__ == '__main__':
              try:
                  results = asyncio.run(analyze_changed_files())
                  print("✅ DeepCode analysis completed")
              except Exception as e:
                  print(f"❌ DeepCode analysis failed: {e}")
                  sys.exit(1)
          EOF

          python deepcode_pr_analysis.py

      - name: Upload DeepCode results
        uses: actions/upload-artifact@v4
        with:
          name: deepcode-analysis
          path: deepcode-analysis.json

  typescript-analysis:
    name: TypeScript Code Analysis
    needs: analyze-changes
    if: needs.analyze-changes.outputs.has_typescript_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/alita-language-tools/package-lock.json

      - name: Install dependencies
        working-directory: extensions/alita-language-tools
        run: |
          npm ci
          npm install --save-dev @typescript-eslint/parser @typescript-eslint/eslint-plugin

      - name: Run TypeScript analysis
        working-directory: extensions/alita-language-tools
        run: |
          # Type checking
          echo "🔍 Running TypeScript type checking..."
          npx tsc --noEmit --strict --listFiles > ts-analysis.log 2>&1 || echo "Type check completed"

          # ESLint analysis
          echo "🔍 Running ESLint analysis..."
          npx eslint src/ --format=json > eslint-results.json 2>/dev/null || echo "ESLint completed"

          # Complexity analysis
          echo "🔍 Analyzing code complexity..."
          find src/ -name "*.ts" -exec wc -l {} + | sort -n > complexity.txt

          # Create summary
          cat > typescript-analysis.json << EOF
          {
            "type_check_log": "$(cat ts-analysis.log | tail -20 | jq -R . | jq -s . | tr -d '\n')",
            "eslint_issues": $(cat eslint-results.json 2>/dev/null || echo "[]"),
            "complexity_summary": "$(cat complexity.txt | tail -10 | jq -R . | jq -s . | tr -d '\n')",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload TypeScript analysis
        uses: actions/upload-artifact@v4
        with:
          name: typescript-analysis
          path: extensions/alita-language-tools/typescript-analysis.json

  security-scan:
    name: Security Analysis
    needs: analyze-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep safety
          pip install -r requirements.txt

      - name: Run security analysis
        run: |
          echo "🔒 Running security analysis..."

          # Bandit for Python security
          bandit -r src/ -f json -o bandit-results.json || echo "Bandit scan completed"

          # Semgrep for broader security patterns
          semgrep --config=auto src/ --json --output=semgrep-results.json || echo "Semgrep scan completed"

          # Safety for known vulnerabilities
          safety check -r requirements.txt --json > safety-results.json || echo "Safety check completed"

          # Create security summary
          cat > security-analysis.json << EOF
          {
            "bandit_results": $(cat bandit-results.json 2>/dev/null || echo "{}"),
            "semgrep_results": $(cat semgrep-results.json 2>/dev/null || echo "{}"),
            "safety_results": $(cat safety-results.json 2>/dev/null || echo "{}"),
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload security analysis
        uses: actions/upload-artifact@v4
        with:
          name: security-analysis
          path: security-analysis.json

  generate-review:
    name: Generate AI Review
    needs: [analyze-changes, deepcode-analysis, typescript-analysis, security-scan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all analysis results
        uses: actions/download-artifact@v4
        with:
          path: ./analysis-results

      - name: Setup Python for review generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate comprehensive review
        run: |
          cat > generate_review.py << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          def load_analysis_result(file_path):
              """Load analysis result if file exists"""
              if Path(file_path).exists():
                  try:
                      with open(file_path, 'r') as f:
                          return json.load(f)
                  except Exception as e:
                      print(f"Error loading {file_path}: {e}")
              return None

          def generate_review_comment():
              """Generate comprehensive AI review comment"""

              # Load analysis results
              deepcode_results = load_analysis_result('analysis-results/deepcode-analysis/deepcode-analysis.json')
              typescript_results = load_analysis_result('analysis-results/typescript-analysis/typescript-analysis.json')
              security_results = load_analysis_result('analysis-results/security-analysis/security-analysis.json')

              # Get change information
              complexity_score = int(os.environ.get('COMPLEXITY_SCORE', 0))
              has_python = os.environ.get('HAS_PYTHON', 'false') == 'true'
              has_typescript = os.environ.get('HAS_TYPESCRIPT', 'false') == 'true'
              has_wasm = os.environ.get('HAS_WASM', 'false') == 'true'

              # Build review comment
              comment = "## 🤖 AI-Powered Code Review\n\n"

              # Overall assessment
              if complexity_score < 30:
                  comment += "✅ **Low complexity change** - This appears to be a straightforward modification.\n\n"
              elif complexity_score < 60:
                  comment += "🔍 **Medium complexity change** - Please review carefully.\n\n"
              else:
                  comment += "⚠️ **High complexity change** - This requires thorough review and testing.\n\n"

              # DeepCode Analysis
              if deepcode_results and has_python:
                  comment += "### 🧠 DeepCode Python Analysis\n\n"

                  total_issues = 0
                  for file_path, results in deepcode_results.items():
                      if isinstance(results, dict) and 'issues' in results:
                          issues = results.get('issues', [])
                          quality_score = results.get('quality_score', 'N/A')

                          if issues:
                              comment += f"**{file_path}** (Quality: {quality_score})\n"
                              for issue in issues[:3]:  # Show max 3 issues per file
                                  severity = issue.get('severity', 'info').title()
                                  description = issue.get('description', 'No description')
                                  line = issue.get('line', 'N/A')
                                  comment += f"- `Line {line}` [{severity}]: {description}\n"
                              total_issues += len(issues)
                              if len(issues) > 3:
                                  comment += f"- ... and {len(issues) - 3} more issues\n"
                              comment += "\n"
                          else:
                              comment += f"✅ **{file_path}** - No issues found (Quality: {quality_score})\n\n"
                      elif isinstance(results, dict) and 'error' in results:
                          comment += f"❌ **{file_path}** - Analysis failed: {results['error']}\n\n"

                  if total_issues > 0:
                      comment += f"📊 **Total DeepCode issues found: {total_issues}**\n\n"

              # TypeScript Analysis
              if typescript_results and has_typescript:
                  comment += "### 📝 TypeScript Analysis\n\n"

                  eslint_issues = typescript_results.get('eslint_issues', [])
                  if eslint_issues:
                      comment += f"🔍 **ESLint found {len(eslint_issues)} issues:**\n"
                      for issue in eslint_issues[:5]:  # Show max 5 issues
                          file_path = issue.get('filePath', 'Unknown file')
                          rule_id = issue.get('ruleId', 'unknown-rule')
                          message = issue.get('message', 'No message')
                          line = issue.get('line', 'N/A')
                          comment += f"- `{Path(file_path).name}:{line}` [{rule_id}]: {message}\n"
                      if len(eslint_issues) > 5:
                          comment += f"- ... and {len(eslint_issues) - 5} more issues\n"
                      comment += "\n"
                  else:
                      comment += "✅ No ESLint issues found\n\n"

              # Security Analysis
              if security_results:
                  comment += "### 🔒 Security Analysis\n\n"

                  bandit_results = security_results.get('bandit_results', {})
                  if bandit_results.get('results'):
                      bandit_issues = bandit_results['results']
                      comment += f"🛡️ **Bandit found {len(bandit_issues)} security issues:**\n"
                      for issue in bandit_issues[:3]:  # Show max 3 security issues
                          test_id = issue.get('test_id', 'unknown')
                          issue_text = issue.get('issue_text', 'No description')
                          filename = issue.get('filename', 'Unknown file')
                          line_number = issue.get('line_number', 'N/A')
                          comment += f"- `{Path(filename).name}:{line_number}` [{test_id}]: {issue_text}\n"
                      if len(bandit_issues) > 3:
                          comment += f"- ... and {len(bandit_issues) - 3} more issues\n"
                      comment += "\n"
                  else:
                      comment += "✅ No security issues found\n\n"

              # Recommendations
              comment += "### 💡 Recommendations\n\n"

              if complexity_score > 50:
                  comment += "🔄 Consider breaking this change into smaller, focused commits\n"

              if has_wasm:
                  comment += "🧮 WASM changes detected - ensure proper testing of component interfaces\n"

              if has_python and has_typescript:
                  comment += "🔗 Full-stack changes detected - verify end-to-end integration\n"

              comment += "📋 Run the full test suite before merging\n"
              comment += "🔍 Consider adding tests for new functionality\n\n"

              # Footer
              comment += f"---\n*AI review generated at {datetime.now().isoformat()}*\n"
              comment += f"*Complexity Score: {complexity_score}/100*"

              return comment

          if __name__ == '__main__':
              review = generate_review_comment()
              with open('ai-review.md', 'w') as f:
                  f.write(review)
              print("AI review generated successfully")
          EOF

          python generate_review.py
        env:
          COMPLEXITY_SCORE: ${{ needs.analyze-changes.outputs.complexity_score }}
          HAS_PYTHON: ${{ needs.analyze-changes.outputs.has_python_changes }}
          HAS_TYPESCRIPT: ${{ needs.analyze-changes.outputs.has_typescript_changes }}
          HAS_WASM: ${{ needs.analyze-changes.outputs.has_wasm_changes }}

      - name: Post AI review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const review = fs.readFileSync('ai-review.md', 'utf8');

              const prNumber = context.payload.pull_request?.number || ${{ github.event.inputs.pr_number }};

              if (prNumber) {
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: review
                });

                console.log('✅ AI review posted successfully');
              } else {
                console.log('❌ Could not determine PR number');
              }
            } catch (error) {
              console.log('❌ Error posting review:', error);
            }

  suggest-reviewers:
    name: Suggest Code Reviewers
    needs: analyze-changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze code ownership and suggest reviewers
        run: |
          cat > suggest_reviewers.py << 'EOF'
          import os
          import subprocess
          from collections import defaultdict

          def get_file_contributors(file_path, limit=5):
              """Get main contributors to a file based on git history"""
              try:
                  result = subprocess.run(
                      ['git', 'shortlog', '-sn', '--', file_path],
                      capture_output=True, text=True
                  )

                  contributors = []
                  for line in result.stdout.strip().split('\n')[:limit]:
                      if line.strip():
                          parts = line.strip().split('\t', 1)
                          if len(parts) == 2:
                              count, name = parts
                              contributors.append((int(count), name))

                  return contributors
              except Exception:
                  return []

          def suggest_reviewers():
              """Suggest reviewers based on changed files"""
              changed_files = """${{ needs.analyze-changes.outputs.files }}""".strip().split('\n')

              contributor_scores = defaultdict(int)
              file_expertise = defaultdict(list)

              for file_path in changed_files:
                  if file_path.strip() and os.path.exists(file_path):
                      contributors = get_file_contributors(file_path)

                      for commits, contributor in contributors:
                          # Weight by number of commits to this file
                          contributor_scores[contributor] += commits
                          file_expertise[contributor].append(file_path)

              # Sort by expertise score
              suggested_reviewers = sorted(
                  contributor_scores.items(),
                  key=lambda x: x[1],
                  reverse=True
              )[:5]  # Top 5 suggestions

              print("🎯 Suggested Reviewers:")
              suggestions = []
              for contributor, score in suggested_reviewers:
                  files = file_expertise[contributor]
                  print(f"  👤 {contributor} (Score: {score}, Files: {len(files)})")
                  suggestions.append({
                      'name': contributor,
                      'score': score,
                      'relevant_files': files[:3]  # Show top 3 files
                  })

              return suggestions

          if __name__ == '__main__':
              suggestions = suggest_reviewers()

              # Create GitHub comment with suggestions
              if suggestions:
                  comment = "## 👥 Suggested Reviewers\n\n"
                  comment += "Based on git history and file expertise:\n\n"

                  for suggestion in suggestions:
                      comment += f"- **{suggestion['name']}** "
                      comment += f"(Score: {suggestion['score']}) - "
                      comment += f"Expert in: {', '.join([f'`{f}`' for f in suggestion['relevant_files']])}\n"

                  comment += "\n*Suggestions based on git commit history and file ownership*"

                  with open('reviewer-suggestions.md', 'w') as f:
                      f.write(comment)
              else:
                  print("No reviewer suggestions available")
          EOF

          python suggest_reviewers.py

      - name: Post reviewer suggestions
        if: hashFiles('reviewer-suggestions.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const suggestions = fs.readFileSync('reviewer-suggestions.md', 'utf8');

              const prNumber = context.payload.pull_request?.number;

              if (prNumber) {
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: suggestions
                });

                console.log('✅ Reviewer suggestions posted');
              }
            } catch (error) {
              console.log('❌ Error posting suggestions:', error);
            }
