name: Research Components Tests

on:
  push:
    branches: [ research/*, main, master ]
    paths:
      - 'src/research/**'
      - 'requirements-research.txt'
      - 'start_research.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/research/**'
      - 'requirements-research.txt'

jobs:
  test-research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-research.txt
    
    - name: Test research imports
      run: |
        python -c "from src.research.constitutional_llm import ConstitutionalLLM; print('✅ Constitutional LLM import success')"
        python -c "from src.research.memory_consolidation import TransformerMemoryConsolidator; print('✅ Memory consolidation import success')"
        python -c "from src.research.research_integration import ResearchIntegrationManager; print('✅ Research integration import success')"
    
    - name: Test research demo (dry run)
      run: |
        # Test that research demo can initialize without errors
        timeout 30 python start_research.py || true
      env:
        RESEARCH_ENABLED: true
        ALITA_ENABLE_Z3: false  # Disable Z3 for CI
    
    - name: Run research unit tests
      run: |
        python -m pytest tests/ -k "research" -v --tb=short
      continue-on-error: true  # Allow tests to be work-in-progress