name: Copilot Setup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'extensions/alita-language-tools/package-lock.json'
      
      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      
      - name: Install VS Code extension dependencies
        working-directory: extensions/alita-language-tools
        run: |
          if [ -f package.json ]; then npm ci; fi
      
      - name: Create environment file
        run: |
          cp .env.example .env
      
      - name: Sanity checks
        run: |
          python -V
          pip -V
          node -v
          npm -v
      
      - name: Validate deployment
        run: |
          python validate_deployment.py
      
      - name: Optional lint checks (non-blocking)
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check . || true; fi
          if command -v black >/dev/null 2>&1; then black . --check || true; fi
      
      - name: Optional VS Code extension compile (non-blocking)
        working-directory: extensions/alita-language-tools
        run: |
          if [ -f package.json ] && npm run compile --if-present || true; then
            echo "Extension compilation completed"
          fi