# Super Alita Agent Configuration

# Core settings
agent:
  name: "Super Alita"
  version: "2.0.0"
  max_memory_mb: 1024

# Event bus configuration (Redis-backed)
event_bus:
  max_history: 1000
  max_workers: 4
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null

# Neural store configuration
neural_store:
  max_atoms: 10000
  cleanup_interval_hours: 24
  fitness_threshold: 0.1

# Plugin configurations
plugins:
  # EventBus Plugin - manages Redis connection lifecycle
  event_bus:
    enabled: true
    health_check_interval: 30
    max_connection_retries: 5
    redis:
      host: "localhost"
      port: 6379
      db: 0

  # Genealogy Tracer Plugin - tracks cognitive evolution
  genealogy_tracer:
    enabled: true
    export_on_shutdown: true
    export_path: "data/genealogy"
    analysis_interval: 300  # 5 minutes
    max_depth_tracking: 10
    enable_pattern_detection: true
    enable_periodic_analysis: true

  semantic_memory:
    enabled: true
    db_path: "./data/chroma_db"
    collection_name: "alita_memory"
    embedding_model: "models/text-embedding-004"
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"

  semantic_fsm:
    enabled: true
    embedding_model: "models/text-embedding-004"
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"
    default_fsm: "agent_lifecycle"

  skill_discovery:
    enabled: true
    base_skills:
      - "data_processing"
      - "text_analysis"
      - "pattern_recognition"
      - "optimization"
      - "problem_solving"
      - "learning"
    discovery_interval_minutes: 30
    proposals_per_cycle: 3
    acceptance_threshold: 0.6
    evolution_iterations: 500

  ladder_aog:
    enabled: true
    mcts_iterations: 100
    max_planning_depth: 10
    exploration_weight: 1.4
    simulation_depth: 5
    domains:
      - "task_planning"
      - "causal_diagnosis"
    save_aog_graphs: true

  self_heal:
    enabled: true
    health_check_interval_seconds: 60
    auto_restart_failed_plugins: true

  conversation:
    enabled: true
    max_context_messages: 10
    response_delay_seconds: 1.0
    enable_reasoning: true
    natural_language_processing: true
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"

# Genealogy settings (legacy, now handled by genealogy_tracer plugin)
genealogy:
  export_interval_hours: 24
  auto_export_graphml: true
  export_directory: "data/genealogy"

# Logging configuration
logging:
  level: "INFO"
  file: "logs/super_alita.log"
  max_file_size_mb: 100
  backup_count: 5

# Development settings
development:
  debug_mode: false
  enable_profiling: false
  mock_external_services: false

# GitHub Copilot Agent Mode preferences (repo-first)
copilot_agent_mode:
  enabled: true
  repo_first: true
  use_github_code_search: true
  adapt_with_web_fallback: true
  instructions_file: ".github/copilot-instructions.md"
  chat_modes_dir: ".github/chatmodes"
  default_workflow: "sdd"
  reasoning_engine: "super-alita-deepcode"
  capabilities:
    - advanced_code_analysis
    - multi_perspective_reasoning
    - confidence_calibration
    - semantic_pattern_recognition
    - risk_assessment
  context_providers:
    - name: "deepcode_reasoning"
      endpoint: "${ALITA_RUNTIME_HOST}/reasoning/analyze-code"
      trigger_patterns: ["function","class","import","def","async"]
      confidence_threshold: 0.6
  reasoning_flow:
    pre_completion: ["analyze_code_context","assess_risk_factors","identify_patterns"]
    post_completion: ["validate_suggestion","calibrate_confidence","provide_alternatives"]
  tools:
    preferred:
      - edit_file
      - create_file
      - read_file
      - list_directory
      - rename_file
      - delete_file
      - create_directory
    notes: |
      File editing is first-class: prefer explicit file operations over inline patches. Keep edits minimal, atomic, and validated.
  sdd:
    endpoints:
      specify: "/sdd/specify"
      plan: "/sdd/plan"
      tasks: "/sdd/tasks"
      validate: "/sdd/validate"
    constitutional_threshold: 0.75
    templates:
      - "templates/sdd/spec-template.md"
      - "templates/sdd/plan-template.md"
      - "templates/sdd/tasks-template.md"
    memory: "memory/sdd/constitutional_sdd_framework.md"
    validators: "src/sdd/validators.py"
    unified_orchestrator:
      stages:
        - "sdd_specify_stage"
        - "sdd_plan_stage"
        - "sdd_tasks_stage"
        - "sdd_validate_stage"
      observability: "src/orchestration/observability.py"
      event_schemas: "src/orchestration/event_schemas.py"
    constitutional_gates:
      - "Specification_Gate"
      - "Planning_Gate"
      - "Implementation_Gate"
      - "Integration_Gate"
    vscode_commands:
      - "alita.sdd.specify"
      - "alita.sdd.plan"
      - "alita.sdd.tasks"
      - "alita.sdd.viewState"
      - "alita.orchestrator.status"
      - "alita.constitutional.review"
      - "alita.enhanced.consensus"
  quality_extensions:
    profile: "elite_code_quality"
    description: "Pydantic AI Copilot middleware patterns for formally verified, performance-aware code."
    activation:
      enabled: true
      minimum_confidence: 0.85
      allow_partial_coverage: false
    patterns:
      - name: "symbolic_execution"
        title: "Symbolic Execution Integration"
        summary: "Generate solver-backed property tests for complex control flow."
        module: ".vscode/copilot-middleware/symbolic_execution.py"
        inject_function: "inject_symbolic_execution_tests"
        validation_check: "_check_symbolic_execution_tests"
        outcomes:
          - "auto_test_generation"
          - "path_constraint_tracking"
      - name: "property_based_testing"
        title: "Mathematical Invariant Testing"
        summary: "Sustain algebraic, monotonic, and bounds invariants via Hypothesis."
        module: ".vscode/copilot-middleware/property_based_testing.py"
        inject_function: "inject_property_tests"
        validation_check: "_check_property_based_tests"
        outcomes:
          - "hypothesis_integration"
          - "algebraic_invariants"
      - name: "formal_verification"
        title: "Formal Contract Enforcement"
        summary: "Provide pre/post/invariant contract scaffolding with typed annotations."
        module: ".vscode/copilot-middleware/formal_verification.py"
        inject_function: "inject_formal_verification"
        validation_check: "_check_formal_verification"
        outcomes:
          - "contract_scaffolding"
          - "type_driven_specifications"
      - name: "performance_optimization"
        title: "Performance Pattern Enforcement"
        summary: "Analyze complexity and suggest memoization or __slots__ optimizations."
        module: ".vscode/copilot-middleware/performance_optimization.py"
        inject_function: "inject_performance_optimizations"
        validation_check: "_check_performance_optimizations"
        outcomes:
          - "algorithmic_complexity_comments"
          - "memoization_guidance"
      - name: "invariant_detection"
        title: "Automated Invariant Enforcement"
        summary: "Detect null, bounds, arithmetic, and state invariants and enforce them."
        module: ".vscode/copilot-middleware/invariant_detection.py"
        inject_function: "inject_invariant_enforcement"
        validation_check: "_check_invariant_enforcement"
        outcomes:
          - "runtime_invariant_checks"
          - "pydantic_validator_generation"
      - name: "complexity_analysis"
        title: "Complexity-Aware Code Generation"
        summary: "Document complexity proofs and monitor runtime operations."
        module: ".vscode/copilot-middleware/complexity_analysis.py"
        inject_function: "inject_complexity_analysis"
        validation_check: "_check_complexity_analysis"
        outcomes:
          - "complexity_profiles"
          - "runtime_enforcement"
      - name: "mutation_gate"
        title: "Mutation Score Gate"
        summary: "Run bounded mutation testing and require >= 90% mutants killed."
        module: ".vscode/copilot-middleware/mutant_gate.py"
        inject_function: "noop_inject"
        validation_check: "check_mutation_gate"
        outcomes:
          - "mutation_score_enforced"
      - name: "cfg_hash_guard"
        title: "CFG Hash Deduplication"
        summary: "Reject duplicated control-flow graphs across the workspace."
        module: ".vscode/copilot-middleware/cfg_hash_guard.py"
        inject_function: "noop_inject"
        validation_check: "check_cfg_uniqueness"
        outcomes:
          - "cfg_hash_registry"
      - name: "sygus_minimizer"
        title: "SyGuS Minimiser"
        summary: "Simplify functions marked with # sygus:minimize using symbolic synthesis."
        module: ".vscode/copilot-middleware/sygus_minimizer.py"
        inject_function: "noop_inject"
        validation_check: "minimise_with_sygus"
        outcomes:
          - "sygus_simplification"
    enforcement_order:
      - "symbolic_execution"
      - "property_based_testing"
      - "formal_verification"
      - "performance_optimization"
      - "invariant_detection"
      - "complexity_analysis"
      - "mutation_gate"
      - "cfg_hash_guard"
      - "sygus_minimizer"

