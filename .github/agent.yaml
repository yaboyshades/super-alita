# Super Alita Agent Configuration

# Core settings
agent:
  name: "Super Alita"
  version: "2.0.0"
  max_memory_mb: 1024

# Event bus configuration (Redis-backed)
event_bus:
  max_history: 1000
  max_workers: 4
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null

# Neural store configuration
neural_store:
  max_atoms: 10000
  cleanup_interval_hours: 24
  fitness_threshold: 0.1

# Plugin configurations
plugins:
  # EventBus Plugin - manages Redis connection lifecycle
  event_bus:
    enabled: true
    health_check_interval: 30
    max_connection_retries: 5
    redis:
      host: "localhost"
      port: 6379
      db: 0

  # Genealogy Tracer Plugin - tracks cognitive evolution
  genealogy_tracer:
    enabled: true
    export_on_shutdown: true
    export_path: "data/genealogy"
    analysis_interval: 300  # 5 minutes
    max_depth_tracking: 10
    enable_pattern_detection: true
    enable_periodic_analysis: true

  semantic_memory:
    enabled: true
    db_path: "./data/chroma_db"
    collection_name: "alita_memory"
    embedding_model: "models/text-embedding-004"
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"

  semantic_fsm:
    enabled: true
    embedding_model: "models/text-embedding-004"
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"
    default_fsm: "agent_lifecycle"

  skill_discovery:
    enabled: true
    base_skills:
      - "data_processing"
      - "text_analysis"
      - "pattern_recognition"
      - "optimization"
      - "problem_solving"
      - "learning"
    discovery_interval_minutes: 30
    proposals_per_cycle: 3
    acceptance_threshold: 0.6
    evolution_iterations: 500

  ladder_aog:
    enabled: true
    mcts_iterations: 100
    max_planning_depth: 10
    exploration_weight: 1.4
    simulation_depth: 5
    domains:
      - "task_planning"
      - "causal_diagnosis"
    save_aog_graphs: true

  self_heal:
    enabled: true
    health_check_interval_seconds: 60
    auto_restart_failed_plugins: true

  conversation:
    enabled: true
    max_context_messages: 10
    response_delay_seconds: 1.0
    enable_reasoning: true
    natural_language_processing: true
    # Secrets are not stored in repo; read from env
    gemini_api_key: "${GEMINI_API_KEY}"

# Genealogy settings (legacy, now handled by genealogy_tracer plugin)
genealogy:
  export_interval_hours: 24
  auto_export_graphml: true
  export_directory: "data/genealogy"

# Logging configuration
logging:
  level: "INFO"
  file: "logs/super_alita.log"
  max_file_size_mb: 100
  backup_count: 5

# Development settings
development:
  debug_mode: false
  enable_profiling: false
  mock_external_services: false

# GitHub Copilot Agent Mode preferences (repo-first)
copilot_agent_mode:
  enabled: true
  repo_first: true
  use_github_code_search: true
  adapt_with_web_fallback: true
  instructions_file: ".github/copilot-instructions.md"
  chat_modes_dir: ".github/chatmodes"
  default_workflow: "sdd"
  reasoning_engine: "super-alita-deepcode"
  capabilities:
    - advanced_code_analysis
    - multi_perspective_reasoning
    - confidence_calibration
    - semantic_pattern_recognition
    - risk_assessment
  context_providers:
    - name: "deepcode_reasoning"
      endpoint: "${ALITA_RUNTIME_HOST}/reasoning/analyze-code"
      trigger_patterns: ["function","class","import","def","async"]
      confidence_threshold: 0.6
  reasoning_flow:
    pre_completion: ["analyze_code_context","assess_risk_factors","identify_patterns"]
    post_completion: ["validate_suggestion","calibrate_confidence","provide_alternatives"]
  tools:
    preferred:
      - edit_file
      - create_file
      - read_file
      - list_directory
      - rename_file
      - delete_file
      - create_directory
    notes: |
      File editing is first-class: prefer explicit file operations over inline patches. Keep edits minimal, atomic, and validated.
  sdd:
    endpoints:
      specify: "/sdd/specify"
      plan: "/sdd/plan"
      tasks: "/sdd/tasks"
      validate: "/sdd/validate"
    constitutional_threshold: 0.75
    templates:
      - "templates/sdd/specification.md"
      - "templates/sdd/plan.md"
      - "templates/sdd/tasks.md"
    memory: "memory/sdd/constitutional_sdd_framework.md"
    validators: "src/sdd/validators.py"
    unified_orchestrator:
      stages:
        - "sdd_specify_stage"
        - "sdd_plan_stage"
        - "sdd_tasks_stage"
        - "sdd_validate_stage"
      observability: "src/orchestration/observability.py"
      event_schemas: "src/orchestration/event_schemas.py"
    constitutional_gates:
      - "Specification_Gate"
      - "Planning_Gate"
      - "Implementation_Gate"
      - "Integration_Gate"
    vscode_commands:
      - "alita.sdd.specify"
      - "alita.sdd.plan"
      - "alita.sdd.tasks"
      - "alita.sdd.viewState"
      - "alita.orchestrator.status"
      - "alita.constitutional.review"
      - "alita.enhanced.consensus"
