version: "3.9"
services:
  # Redis for distributed event bus
  redis:
    image: redis:7-alpine
    container_name: super-alita-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles: ["redis", "microservices"]

  # Consensus gRPC server
  consensus-service:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    container_name: super-alita-consensus
    ports:
      - "50052:50052"
    environment:
      - CONSENSUS_GRPC_BIND=0.0.0.0:50052
      - CONSENSUS_BASE_URL=http://host.docker.internal:11434/v1
      - CONSENSUS_MODEL_NAME=gpt-oss:20b
      - CONSENSUS_TIMEOUT=60
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["microservices"]

  app:
    build: .
    container_name: reug-runtime
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - REUG_EVENT_LOG_DIR=/data/logs/events
      - REUG_TOOL_REGISTRY_DIR=/data/tools_registry
      # Microservices configuration
      - CONSENSUS_SERVICE_MODE=grpc
      - CONSENSUS_GRPC_URL=consensus-service:50052
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS_EVENT_BUS=true
    volumes:
      - ./src:/app/src:rw
      - ./app.py:/app/app.py:rw
      - ./logs:/data/logs:rw
      - ./tools_registry:/data/tools_registry:rw
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["app"]
    depends_on:
      - redis
      - consensus-service

  # Optional Redis, KG, etc. (disabled by default)
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]
  #   profiles: ["redis"]
  context-server:
    build: .
    command: python backend/context_server.py
    profiles: ["context"]
    ports:
      - "5001:5001"

  swarm:
    build: .
    command: python backend/agent_orchestrator.py
    profiles: ["swarm"]
    environment:
      - SWARM_MODEL=oss-20b
    ports:
      - "5002:5002"

  finetune:
    build: .
    command: python backend/fine_tuning/train_adapter.py --feedback-file training_data/feedback.json --epochs 1
    profiles: ["finetune"]

  # Example ollama service (optional; user may run host-level instead)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  #   volumes: ["./ollama:/root/.ollama"]
  #   profiles: ["ollama"]

volumes:
  redis_data:
