[pytest]
addopts = -ra -q
asyncio_mode = auto
markers =
    core: minimal green-belt tests for CI
    broken: known-bad pending repair (tracked)
    slow: slow tests
    integration_redis: marks tests that require a running redis instance
    integration_puter: marks tests that exercise the Puter API integration
norecursedirs = legacy .venv build dist .tox
