spec_id: user.create
version: 1.3.0
surface:
  language_targets: [python, typescript]
  visibility: public
io:
  params:
    - name: data
      type: UserIn
      required: true
    - name: referrer
      type: string | null
      default: null
  returns: UserOut
contracts:
  pre:
    - "data.email is RFC5322-valid"
    - "len(data.name) > 0"
  post:
    - "result.id is nonempty"
    - "result.email == data.email"
    - "result.created_at is ISO8601Z"
invariants:
  - "no PII leakage in logs"
effects: [db]
errors:
  - code: E_DUP_EMAIL
    when: "email already exists"
examples:
  - name: happy
    input: { data: {email: a@b.co, name: "Ann"}, referrer: null }
    output: { id: "u_123", email: a@b.co, name: "Ann", created_at: "2025-09-22T10:00:00Z" }
policies:
  safety: low
  privacy: strict
  perf:
    p95_ms: 40
generators:
  pbt:
    UserIn:
      email: "gen.email()"
      name : "gen.text(1,80)"