# Prometheus Configuration for Super Alita Performance Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'super-alita-dev'
    environment: 'development'

# Load alerting rules
rule_files:
  - "/etc/prometheus/alerting_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # Super Alita application metrics
  - job_name: 'super-alita'
    static_configs:
      - targets: ['super-alita-app:9464']
    scrape_interval: 5s
    metrics_path: /metrics
    honor_labels: true
    params:
      collect: ['extension_metrics']

  # System metrics via Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Grafana metrics (optional)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: /metrics

  # AlertManager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
    metrics_path: /metrics

  # High-frequency scraping for SLO monitoring
  - job_name: 'super-alita-slo'
    static_configs:
      - targets: ['super-alita-app:9464']
    scrape_interval: 1s
    metrics_path: /metrics
    params:
      collect: ['slo_metrics']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'extension_(latency|error|slo).*'
        action: keep

# Remote write configuration (for long-term storage)
